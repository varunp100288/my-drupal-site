name: Deploy to Pantheon

on:
  push:
    branches:
      - main  # Trigger on pushes to the 'main' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v3

      # Debugging: Check SSH_PRIVATE_KEY secret
      - name: Check if SSH_PRIVATE_KEY is set
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "SSH_PRIVATE_KEY is not set"
            exit 1
          else
            echo "SSH_PRIVATE_KEY is set"
          fi
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      # Set up SSH keys
      - name: Set up SSH keys
        run: |
          mkdir -p $HOME/.ssh
          echo "$SSH_PRIVATE_KEY" > $HOME/.ssh/id_rsa
          chmod 600 $HOME/.ssh/id_rsa
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      # Disable StrictHostKeyChecking for Pantheon
      - name: Configure SSH
        run: |
          echo -e "Host *\n  StrictHostKeyChecking no\n  UserKnownHostsFile /dev/null" >> ~/.ssh/config

      # Add Pantheon to known hosts (verbose mode for debugging)
      - name: Add Pantheon to known hosts
        run: |
          echo "Running ssh-keyscan..."
          ssh-keyscan -v -H codeserver.dev.3552ce4b-c642-4933-b08d-c3377021392f.drush.in >> $HOME/.ssh/known_hosts
          echo "ssh-keyscan completed"
        continue-on-error: true  # Continue even if ssh-keyscan fails

      # Debugging: List files in .ssh directory
      - name: List .ssh directory files
        run: ls -la $HOME/.ssh

      # Verify SSH connection to Pantheon
      - name: Test SSH connection to Pantheon
        run: |
          ssh -T git@codeserver.dev.3552ce4b-c642-4933-b08d-c3377021392f.drush.in

      # Deploy to Pantheon (using master branch)
      - name: Deploy to Pantheon
        run: |
          git remote add pantheon git@codeserver.dev.3552ce4b-c642-4933-b08d-c3377021392f.drush.in:~mydrupalsitev.git
          git push pantheon master  # Push to master branch instead of main
