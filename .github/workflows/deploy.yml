name: Deploy to Pantheon

on:
  push:
    branches:
      - main  # Trigger on pushes to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Terminus
      uses: pantheon-systems/terminus-action@v1
      with:
        terminus_version: '3.x'

    - name: SSH Key Setup
      run: |
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -t rsa codeserver.dev.3552ce4b-c642-4933-b08d-c3377021392f.drush.in >> ~/.ssh/known_hosts

    - name: Authenticate with Terminus
      run: terminus auth:login --machine-token $TERMINUS_MACHINE_TOKEN

    - name: Clone Pantheon repository
      run: |
        git clone ssh://codeserver.dev.3552ce4b-c642-4933-b08d-c3377021392f@codeserver.dev.3552ce4b-c642-4933-b08d-c3377021392f.drush.in:2222/~/repository.git -b master pantheon-site
        cd pantheon-site

    - name: Pull changes from GitHub main branch
      run: |
        git pull origin main  # Pull changes from the GitHub `main` branch

    - name: Commit and push changes to Pantheon
      run: |
        git add .
        git commit -m "Deploy updates from GitHub"
        git push origin master  # Push to Pantheon’s `master` branch

    - name: Deploy and import config
      run: |
        terminus env:deploy --note "GitHub Actions Deployment"
        terminus env:clear-caches
        terminus remote:drush $PANTHEON_SITE.$PANTHEON_ENV -- cim -y
