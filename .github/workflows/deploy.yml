name: Deploy to Pantheon

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Debugging: Check SSH_PRIVATE_KEY
        run: |
          # Check if SSH_PRIVATE_KEY is being retrieved correctly
          echo "SSH_PRIVATE_KEY Length: ${#${{ secrets.SSH_PRIVATE_KEY }}}"
          # This should print a number greater than 0 if the secret is retrieved correctly

      - name: Set up SSH key
        run: |
          mkdir -p $HOME/.ssh
          
          # Save the SSH private key from the GitHub secret
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > $HOME/.ssh/id_rsa

          chmod 600 $HOME/.ssh/id_rsa

          # Check permissions of id_rsa
          ls -l $HOME/.ssh/

          # Add Pantheon Git host to known_hosts
          ssh-keyscan -H codeserver.dev.3552ce4b-c642-4933-b08d-c3377021392f.drush.in >> $HOME/.ssh/known_hosts

          # List known hosts
          cat $HOME/.ssh/known_hosts

      - name: Push to Pantheon
        run: |
          git remote add pantheon ssh://codeserver.dev.3552ce4b-c642-4933-b08d-c3377021392f.drush.in:2222/~/repository.git || true
          git push pantheon main:master --force
