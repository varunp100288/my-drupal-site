id: custom_migration
label: 'Custom Migration for Article Titles'
migration_group: custom_migrations

source:
  plugin: custom_migration
  key: external  # This must match the external DB key in settings.php
  query: "SELECT nid, title FROM node_field_data WHERE type = 'article'"
  fields:
    nid: 'Node ID'
    title: 'Article Title'
    body_value: 'Body Content'
    body_format: 'Body Format'

  ids:
    nid:
      type: integer

process:
  title: title
  body/value: body_value
  body/format: body_format

destination:
  plugin: entity:node
  default_bundle: article  # Migrating into the Article content type

migration_dependencies: {}
